<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventário Oficinas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
<style>
/* Manual de Uso da Marca Carmak: #a9cc44 · #39653b · #003938 · #ffffff · #eb0a1e · Roboto */
/* Visual único em tons claros (sem modo escuro) */
:root{
  color-scheme:light;
  --lima:#a9cc44; --verde:#39653b; --escuro:#003938;
  --bg:#f3f6f1; --panel:#ffffff; --ink:#003938; --ink2:#3f5a52; --muted:#6f8580; --line:#d9e2d6;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
.wrap{max-width:1500px;margin:0 auto;padding-inline:20px;padding-block:20px;display:flex;flex-direction:column;gap:14px;min-height:100%}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;background:#ffffff;border:1px solid var(--line);border-bottom:5px solid var(--lima);border-radius:12px;padding:14px 18px;box-shadow:0 1px 2px rgba(0,57,56,.05),0 12px 30px -24px rgba(0,57,56,.35)}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.mark{height:44px;width:auto;background:#fff;border-radius:8px;padding:6px 10px;display:block;flex:none}
h1{margin:0;font-size:24px;font-weight:900;color:var(--escuro);white-space:nowrap}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs a{color:var(--escuro);background:#fff;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:7px 14px;font-weight:500}
nav.tabs a:hover{border-color:var(--lima);background:#f4f8e8}
nav.tabs a[aria-current="page"]{background:var(--lima);color:#003938;font-weight:700}
nav.tabs a:focus-visible{outline:2px solid var(--lima);outline-offset:2px}
.hint{font-size:12px;color:var(--muted)}
.frame-box{flex:1;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:78vh}
iframe{flex:1;width:100%;border:0;min-height:78vh;background:#fff}
.empty{margin:auto;max-width:560px;padding:28px;text-align:center;color:var(--ink2);line-height:1.6}
.empty b{color:var(--ink)}
@media (max-width:560px){ .wrap{padding-inline:16px} h1{font-size:20px;white-space:normal} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <img class="mark" alt="Carmak" src="logo-carmak.png">
      <h1>Inventário · Oficinas</h1>
    </div>
    <nav class="tabs" aria-label="Páginas">
      <a href="./">Previsão de Entregas</a>
      <a href="inventario.html" aria-current="page">Inventário</a>
    </nav>
  </header>

  <div class="hint" id="hint">Relatório "Inventário Oficina" do Power BI. Atualiza sozinho a cada 2 horas. Use os filtros do próprio relatório.</div>

  <div class="frame-box" id="box"></div>
</div>

<script>
// Link de incorporação segura do Power BI (Arquivo → Inserir relatório → Site ou portal)
const EMBED_URL = "";

const box = document.getElementById("box");
if (EMBED_URL) {
  const f = document.createElement("iframe");
  f.title = "Inventário Oficina (Power BI)";
  f.src = EMBED_URL;
  f.allowFullscreen = true;
  box.appendChild(f);
} else {
  box.innerHTML = '<div class="empty"><b>Relatório ainda não configurado.</b><br>Falta o link de incorporação do Power BI "Inventário Oficina".</div>';
}
</script>
</body>
</html>
